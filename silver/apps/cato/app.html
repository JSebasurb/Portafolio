<section class="tab" id="cato">
  <h2>{{CATO_TITLE}}</h2>
  <p class="sub">{{CATO_SUB}}</p>
  <div class="ctas" style="margin:0 0 22px"><a class="pill sm" href="{{CATO_URL}}" target="_blank" rel="noopener">{{CATO_OPEN}} ↗</a></div>
  <div class="cstats" id="cStats"></div>

  <div class="cv" id="cHome">
    <div class="cgrid">
      <div class="ccard2"><h3>{{CATO_LVL_T}}</h3><p>{{CATO_LVL_S}}</p><div class="cbtns" id="cLevels"></div></div>
      <div class="ccard2"><h3>{{CATO_CAT_T}}</h3><p>{{CATO_CAT_S}}</p><div class="cbtns cats" id="cCats"></div></div>
    </div>
    <div class="cgrid three">
      <button class="tile cbtn-big" id="cMixBtn"><div class="ico">🎲</div><h3>{{CATO_MIX_T}}</h3><p>{{CATO_MIX_S}}</p></button>
      <button class="tile cbtn-big" data-cato="cCuri"><div class="ico">💡</div><h3>{{CATO_CURI_T}}</h3><p>{{CATO_CURI_S}}</p></button>
      <button class="tile cbtn-big" data-cato="cRef"><div class="ico">📘</div><h3>{{CATO_REF_T}}</h3><p>{{CATO_REF_S}}</p></button>
    </div>
    <div class="cfoot"><button class="link" id="cReset">{{CATO_RESET}}</button></div>
  </div>

  <div class="cv" id="cQuiz" hidden>
    <div class="cqtop"><button class="link" data-cato="cHome">‹ {{CATO_BACK}}</button><b id="cQTitle"></b><span id="cCount"></span></div>
    <div class="cprog"><i id="cProg"></i></div>
    <div class="ccard2 qcard" id="cQCard">
      <small id="cCat"></small>
      <h3 id="cQ"></h3>
      <div class="copts" id="cOpts"></div>
      <p class="cexp" id="cExp" hidden></p>
      <div class="rd-bar"><button class="pill sm" id="cNext" hidden>{{CATO_NEXT}}</button></div>
    </div>
  </div>

  <div class="cv" id="cResult" hidden>
    <div class="ccard2 cres"><h3 id="cResTitle"></h3><p id="cResBody"></p>
      <div class="rd-bar" style="justify-content:center"><button class="pill sm" data-cato="cHome">{{CATO_HOME}}</button></div></div>
  </div>

  <div class="cv" id="cCuri" hidden>
    <div class="ccard2 cur"><small id="cCuCat"></small><h3 id="cCuT"></h3><p id="cCuF"></p><p class="cq"><b>?</b> <span id="cCuQ"></span></p>
      <div class="rd-bar" style="justify-content:center"><button class="pill sm" data-cato="cCuri">{{CATO_NEXT_TIP}}</button><button class="link" data-cato="cHome">‹ {{CATO_BACK}}</button></div></div>
  </div>

  <div class="cv" id="cRef" hidden>
    <div class="cqtop"><button class="link" data-cato="cHome">‹ {{CATO_BACK}}</button><b>{{CATO_REF_T}}</b></div>
    <div id="cRefBody"></div>
  </div>
</section>
